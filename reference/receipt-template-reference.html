<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>إيصال استلام نقدية | بوينت أب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c09;--card:#1a1610;--ln:#3a2f1c;--tx:#f3ead6;--mu:#a89d84;--g1:#f5d77a;--g2:#b8860b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% -10%,#3b2a12,var(--bg) 55%);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;min-height:100vh}
.gold{background:linear-gradient(135deg,var(--g1),var(--g2) 60%,#f5d77a);-webkit-background-clip:text;background-clip:text;color:transparent}
header{text-align:center;padding:22px 12px 8px}
.logo{font-size:44px;font-weight:900;letter-spacing:1px;line-height:1;direction:ltr}
.logo i{font-style:normal;color:#e8e8e8;-webkit-text-fill-color:#e8e8e8}
.ar{font-size:30px;font-weight:900}.sub{color:var(--mu);font-size:14px}.sub2{color:var(--g1);font-size:12px;letter-spacing:.5px}
nav{display:flex;gap:6px;justify-content:center;padding:12px;flex-wrap:wrap;border-bottom:1px solid var(--ln)}
nav button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--ln);padding:9px 16px;border-radius:10px;font:700 14px Cairo,sans-serif;cursor:pointer}
nav button.on,.btn.p{background:linear-gradient(135deg,var(--g1),var(--g2));color:#1a1204;border:0}
.btn.d{color:#ff8a7a}.btn.s{padding:5px 10px;font-size:12px}
main{max-width:980px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px}
h2,h3{margin:0 0 10px}h3{font-size:16px;color:var(--g1)}
input,select,textarea{width:100%;background:#0e0c09;border:1px solid var(--ln);color:var(--tx);padding:9px;border-radius:8px;font:14px Cairo,sans-serif;margin:3px 0 8px}
label{font-size:12px;color:var(--mu)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.alb{cursor:pointer;overflow:hidden;padding:0}.alb img{width:100%;height:150px;object-fit:cover;display:block;background:#000}.alb div{padding:10px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.ph img{width:100%;height:120px;object-fit:cover;border-radius:8px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mu)}
.bar{height:8px;background:#0e0c09;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g1))}
.tl{border-right:2px solid var(--g2);padding-right:14px;margin-right:6px}.tl>div{position:relative;margin-bottom:12px}.tl>div:before{content:"";position:absolute;right:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:#3a2f1c}.tl .ok:before{background:var(--g1)}
.note{font-size:12px;color:var(--mu);background:#241c0e;border:1px dashed var(--g2);padding:8px;border-radius:8px}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--ln);text-align:right;font-size:13px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);overflow:auto;padding:14px;z-index:9}
#ov img.big{max-width:100%;display:block;margin:auto;border-radius:8px}
.paper{background:#fff;color:#222;max-width:720px;margin:auto;padding:24px;border-radius:6px}.paper td,.paper th{border-color:#ddd;color:#222}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;background:#fff;padding:0}.noprint{display:none!important}}

:root{--bg:#f5f2eb;--card:#fdfcf9;--ln:#e4dccb;--tx:#2a2112;--mu:#7d7260;--g1:#a67a2b;--g2:#8a6420}
body{background:var(--bg);color:var(--tx)}
.gold{background:none;-webkit-text-fill-color:var(--g1);color:var(--g1)}
header{padding:18px 12px 4px}.lg{width:min(300px,70%);display:block;margin:0 auto 6px}
h1{font-size:22px;margin:4px 0 2px;color:#1d160a}#who{margin-top:8px}
nav{border:0;border-bottom:2px solid var(--g1);gap:8px;padding:12px 14px}
nav button{flex:1;min-width:90px;background:var(--card);border:1px solid var(--ln);color:var(--tx);padding:12px 8px;border-radius:12px}
nav button.on,.btn.p{background:var(--g1);color:#fff;border:0}
.btn{background:#fff;color:var(--g2);border:1.5px solid var(--g1);border-radius:12px}.btn.d{color:#b3402f;border-color:#d9a69d}
.card{background:var(--card);border-radius:16px}h3{color:#1d160a;font-size:17px}h2{color:#1d160a}
input,select,textarea{background:#f3efe6;border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:12px}
.bar{background:#e9e2d2}.bar i{background:var(--g1)}.note{background:#f7efd9;border-color:var(--g1);color:#6b5120}
.tl{border-color:var(--g1)}.tl>div:before{background:#d9cfb8}.tl .ok:before{background:var(--g1)}
.stats b{color:#1d160a}.cred{background:#f7efd9;border:1px dashed var(--g1);border-radius:12px;padding:12px;white-space:pre-line;direction:rtl;font-size:14px}

.paper{position:relative;overflow:hidden;color:#222;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper>*{position:relative;z-index:1}
.paper>.wm{position:absolute;inset:0;z-index:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='180'><text x='140' y='95' text-anchor='middle' transform='rotate(-25 140 95)' font-family='Cairo,Tahoma' font-size='22' font-weight='bold' fill='%23a67a2b' fill-opacity='.16'>POINT UP • بوينت أب</text></svg>")}
.paper>.wl{position:absolute;z-index:0;top:45%;left:50%;width:60%;transform:translate(-50%,-50%);opacity:.09}
.ph0{display:flex;align-items:center;gap:12px;border-bottom:3px solid #a67a2b;padding-bottom:8px}.ph0 img{width:150px}
.pt{text-align:center;color:#1d160a!important}.mt{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0;font-size:13px}
.bq th{background:#a67a2b;color:#fff}.bq .sh td{background:#efe3c4;font-weight:700}.bq .ss td{background:#faf3df;font-weight:700}
.tt{width:auto;min-width:55%;margin:10px 0 0;margin-right:auto;margin-left:0}.tt th{background:#a67a2b;color:#fff}
.nt{margin-top:12px;font-size:13px;border:1px dashed #a67a2b;padding:8px}.ft{text-align:center;font-size:11px;color:#8a6420;margin-top:14px}
.alg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.alg img{width:100%;height:190px;object-fit:cover;border-radius:6px;break-inside:avoid}
.it{border:1px solid var(--ln);border-radius:12px;padding:8px;margin-bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:center}.it textarea{grid-column:1/-1;margin:0}.it input,.it select{margin:0}

#pp .paper{max-width:var(--pw,720px);font-size:var(--fs,14px)}
#pp .paper td,#pp .paper th{font-size:calc(var(--fs,14px) - 1px)}
.nowm .wm,.nowm .wl{display:none}
.cl p{margin:4px 0;line-height:1.9}.cl .c{break-inside:avoid;margin:8px 0}.cl h4{margin:12px 0 4px;color:#8a6420}
.pt2 td{vertical-align:top;line-height:1.8}.sg{margin-top:26px;break-inside:avoid}.sg td{width:50%;height:130px;border:1px solid #bbb;vertical-align:top;text-align:center}
.opg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 8px}
@media print{.paper{overflow:visible!important}#pp .paper{max-width:none!important}.paper>.wm,.paper>.wl{position:fixed!important}}
.amt{border:2px solid #a67a2b;border-radius:10px;text-align:center;font:900 22px Cairo,sans-serif;padding:8px;margin:10px 0;color:#8a6420}.sg td{height:105px}</style></head><body>

K5CYII="><h1>إيصال استلام نقدية — بوينت أب</h1><div class="sub">إشراف · تشطيبات · توريدات</div></header>
<main id="app"></main><div id="ov" hidden></div>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const S={po:{sz:'A4',or:'portrait',mg:15,fs:14,wm:true}};
const LOGO=()=>document.querySelector('.lg').src;
function paper(title,body){return `<div class="paper"><div class="wm"></div><img class="wl" src="${LOGO()}"><div class="ph0"><img src="${LOGO()}"><div><b>بوينت أب — شركة مقاولات عامة وتوريدات</b><div style="font-size:12px">تشطيبات وديكور وتصميم</div></div></div><h3 class="pt">${title}</h3>${body}<div class="ft">بوينت أب · Point UP</div></div>`}
async function saveFile(fn,data){const dl=window.claude&&await claude.use('downloads');if(!dl)return alert('الحفظ المباشر غير متاح هنا. استخدم «طباعة / PDF» ثم اختر حفظ كـ PDF');try{await dl.save({filename:fn,data})}catch(e){if(!e||e.code!=='declined')alert('تعذر الحفظ')}}
const SZ={A4:[210,297],A5:[148,210],Letter:[216,279]};
S.po={sz:'A4',or:'portrait',mg:15,fs:14,wm:true};
const nl=x=>esc(x).replace(/\n/g,'<br>');
function ov(h,fn,txt){S.fn=fn;S.txt=txt||fn;const o=S.po,sel=(k,a)=>a.map(([v,l])=>`<option value="${v}" ${String(o[k])===String(v)?'selected':''}>${l}</option>`).join('');
$('ov').hidden=false;$('ov').innerHTML=`<div class="noprint"><button class="btn" onclick="$('ov').hidden=true">إغلاق ✕</button> <button class="btn p" onclick="doPrint()">طباعة / PDF</button> <button class="btn" onclick="tg('opts')">خيارات الطباعة</button> <button class="btn" onclick="tg('shr')">مشاركة</button> <button class="btn" onclick="saveCopy()">حفظ على الجهاز</button> <span id="pgs" style="color:#ddd;font-size:12px"></span></div>
<div id="opts" class="card noprint" hidden style="margin-top:8px"><div class="opg"><div><label>حجم الورق</label><select onchange="setPO('sz',this.value)">${sel('sz',[['A4','A4'],['A5','A5'],['Letter','Letter']])}</select></div><div><label>الاتجاه</label><select onchange="setPO('or',this.value)">${sel('or',[['portrait','طولي'],['landscape','عرضي']])}</select></div><div><label>الهوامش</label><select onchange="setPO('mg',+this.value)">${sel('mg',[[8,'ضيقة'],[15,'عادية'],[25,'واسعة']])}</select></div><div><label>حجم الخط</label><select onchange="setPO('fs',+this.value)">${sel('fs',[[12,'صغير'],[14,'متوسط'],[16,'كبير']])}</select></div><div><label>العلامة المائية</label><select onchange="setPO('wm',this.value==='1')"><option value="1" ${o.wm?'selected':''}>تظهر</option><option value="0" ${o.wm?'':'selected'}>مخفية</option></select></div></div></div>
<div id="shr" class="card noprint" hidden style="margin-top:8px"><button class="btn s" onclick="shareTo('wa')">واتساب</button> <button class="btn s" onclick="shareTo('mail')">بريد إلكتروني</button> <button class="btn s" onclick="shareTo('sys')">مشاركة عبر الجهاز (ملف)</button> <button class="btn s" onclick="shareTo('copy')">نسخ النص</button></div><br><div id="pp">${h}</div>`;applyPO()}
const tg=i=>{$(i).hidden=!$(i).hidden};
function setPO(k,x){S.po[k]=x;applyPO()}
function applyPO(){const o=S.po,[w,h]=SZ[o.sz],L=o.or==='landscape';let st=document.getElementById('pg');if(!st){st=document.createElement('style');st.id='pg';document.head.appendChild(st)}st.textContent=`@page{size:${o.sz} ${o.or};margin:${o.mg}mm}`;const pp=$('pp');pp.style.setProperty('--fs',o.fs+'px');pp.style.setProperty('--pw',(L?h:w)+'mm');pp.classList.toggle('nowm',!o.wm);const ph=((L?w:h)-2*o.mg)*3.78;setTimeout(()=>{$('pgs').textContent='≈ '+Math.max(1,Math.ceil(pp.offsetHeight/ph))+' ورقة'},60)}
function doPrint(){try{window.print()}catch(e){alert('الطباعة المباشرة غير متاحة هنا. استخدم «حفظ على الجهاز» ثم افتح الملف واطبعه.')}}
function fullHtml(){return '<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+S.fn+'</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><style>body{margin:0;background:#eee;font-family:Cairo,Tahoma,sans-serif;padding:12px}'+document.querySelector('style').textContent+document.getElementById('pg').textContent+'@media print{body>*:not(#ov){display:block!important}body{padding:0}}</style></head><body>'+$('pp').outerHTML+'</body></html>'}
function saveCopy(){saveFile(S.fn+'.html',fullHtml())}
async function shareTo(k){const t=S.txt,fn=S.fn;if(k==='wa')open('https://wa.me/?text='+encodeURIComponent(t));
else if(k==='mail')open('mailto:?subject='+encodeURIComponent(fn)+'&body='+encodeURIComponent(t));
else if(k==='copy')navigator.clipboard.writeText(t).then(()=>alert('تم النسخ'),()=>prompt('انسخ النص:',t));
else{try{const fl=new File([fullHtml()],fn+'.html',{type:'text/html'});if(navigator.canShare&&navigator.canShare({files:[fl]}))await navigator.share({files:[fl],title:fn,text:t});else await navigator.share({title:fn,text:t})}catch(e){if(!e||e.name!=='AbortError')alert('المشاركة عبر الجهاز غير متاحة هنا. جرّب واتساب أو «حفظ على الجهاز».')}}}

const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'],tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],hun=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function t3(n){const h=Math.floor(n/100),r=n%100,a=[];if(h)a.push(hun[h]);if(r){if(r<20)a.push(ones[r]);else{const o=r%10;a.push((o?ones[o]+' و':'')+tens[Math.floor(r/10)])}}return a.join(' و')}
const sc=(n,a,b,pl,sg)=>n===1?a:n===2?b:n<=10?t3(n)+' '+pl:t3(n)+' '+sg;
function words(n){if(n===0)return 'صفر';const p=[],b=Math.floor(n/1e9),m=Math.floor(n/1e6)%1000,k=Math.floor(n/1e3)%1000,r=n%1000;if(b)p.push(sc(b,'مليار','ملياران','مليارات','مليار'));if(m)p.push(sc(m,'مليون','مليونان','ملايين','مليون'));if(k)p.push(sc(k,'ألف','ألفان','آلاف','ألف'));if(r)p.push(t3(r));return p.join(' و')}
function tafqeet(x){x=Math.round((+x||0)*100)/100;const g=Math.floor(x),q=Math.round((x-g)*100);if(!g&&!q)return '';return words(g)+' جنيه مصري'+(q?' و'+words(q)+' قرش':'')+' فقط لا غير'}
const K='pu_rcpt_v1',K2='pu_rcpt_co',K3='pu_rcpt_hist';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let CO=ld(K2,{addr:'',phone:'',reg:'',tax:'',rname:'',rtitle:'المحاسب'}),H=ld(K3,[]);
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const nextNo=()=>'REC-'+new Date().getFullYear()+'-'+String(Math.max(0,...H.map(x=>+x.no.split('-').pop()||0))+1).padStart(4,'0');
const blank=()=>({no:nextNo(),d:new Date().toLocaleDateString('ar-EG'),amt:0,ctype:'تشطيبات',kind:'دفعة تحت الحساب',ref:'',proj:'',val:0,before:0,final:'جزئية',notes:'',p1:{name:'',nid:'',phone:'',cap:'المالك',capNote:'',owner:''}});
let C=ld(K,null)||blank();
const KINDS=['دفعة مقدمة (عربون)','دفعة تحت الحساب','دفعة من مستخلص','الدفعة الختامية','سداد كامل القيمة'];
function recHtml(d,tag){const p=d.p1,rep=p.cap!=='المالك',rem=(+d.val||0)-(+d.before||0)-(+d.amt||0);
const b=`<div class="cl"><div class="mt"><span>رقم الإيصال: <b>${esc(d.no)}</b>${tag?' · '+esc(tag):''}</span><span>التاريخ: ${esc(d.d)}</span><span>طريقة السداد: <b>نقدًا</b></span></div>
<div class="amt">${fmt(d.amt)} جنيه مصري</div>
<table class="pt2"><tr><td style="width:100px"><b>المستلم (الشركة):</b></td><td><b>شركة بوينت أب للمقاولات العامة والتوريدات</b> (تشطيبات وديكور وتصميم)${CO.addr?'<br>العنوان: '+esc(CO.addr):''}${CO.phone?' — تليفون: '+esc(CO.phone):''}${CO.reg?'<br>سجل تجاري: '+esc(CO.reg):''}${CO.tax?' — بطاقة ضريبية: '+esc(CO.tax):''}</td></tr>
<tr><td><b>المسلِّم (العميل):</b></td><td><b>السيد / ${esc(p.name)||'................'}</b> — رقم البطاقة: ${esc(p.nid)||'................'} — تليفون: ${esc(p.phone)||'................'}<br>بصفته: <b>${rep?'نائبًا عن المالك'+(p.owner?' / '+esc(p.owner):''):'المالك'}</b>${rep&&p.capNote?' ('+esc(p.capNote)+')':''}</td></tr></table>
<p>استلمت شركة بوينت أب${CO.rname?'، ويمثلها السيد / <b>'+esc(CO.rname)+'</b>'+(CO.rtitle?' ('+esc(CO.rtitle)+')':''):''}، من العميل المذكور أعلاه مبلغًا وقدره <b>${fmt(d.amt)} جنيه مصري</b> (<b>${tafqeet(d.amt)||'................'}</b>) <b>نقدًا</b>، وذلك <b>${esc(d.kind)}</b> عن اتفاق <b>${esc(d.ctype)}</b>${d.ref?' رقم / بيان: '+esc(d.ref):''}${d.proj?' — مشروع / موقع: '+esc(d.proj):''}.</p>
${+d.val?`<table><tr><th>قيمة الاتفاق</th><th>المسدد سابقًا</th><th>المسدد بهذا الإيصال</th><th>المتبقي</th></tr><tr><td>${fmt(d.val)}</td><td>${fmt(d.before)}</td><td>${fmt(d.amt)}</td><td><b>${fmt(Math.max(0,rem))}</b></td></tr></table>`:''}
<p><b>أحكام الإيصال:</b><br>١- ${d.final==='نهائية'?'يُعد هذا الإيصال مخالصة نهائية وتامة عن كامل مستحقات الشركة المتعلقة بالاتفاق المذكور، ولا يحق للشركة المطالبة بأي مبالغ أخرى عنه.':'يُعد هذا الإيصال مخالصة بقيمة المبلغ الوارد به فقط، ولا يُعتبر مخالصة نهائية عن باقي مستحقات الشركة.'}<br>٢- لا يُعتد بهذا الإيصال إلا إذا كان موقعًا من المستلم ومختومًا بخاتم الشركة.<br>٣- حُرر هذا الإيصال من نسختين، نسخة للعميل ونسخة للشركة.</p>
${d.notes?`<div class="nt"><b>ملاحظات:</b><br>${esc(d.notes).replace(/\n/g,'<br>')}</div>`:''}
<table class="sg"><tr><td><b>المستلم (الشركة)</b><br>${esc(CO.rname)||'الاسم:'}<br><br>التوقيع والختم:</td><td><b>المسلِّم (العميل)</b><br>${esc(p.name)||'الاسم:'}<br><br>التوقيع:</td></tr></table></div>`;
return paper('إيصال استلام نقدية',b)}
const recText=d=>`إيصال استلام نقدية رقم ${d.no} — ${d.d}\nاستلمت شركة بوينت أب من السيد/ ${d.p1.name} مبلغ ${fmt(d.amt)} جنيه (${tafqeet(d.amt)}) نقدًا، ${d.kind} عن اتفاق ${d.ctype}${d.proj?' — '+d.proj:''}.\nبوينت أب`;
function ed(){const d=C,p=d.p1,rep=p.cap!=='المالك',I=(o,k,l,ex)=>`<div><label>${l}</label><input ${ex||''} value="${esc(o[k])}" onchange="setV('${o===p?'p1':o===CO?'co':''}','${k}',this.value)"></div>`,Sel=(k,a)=>`<select onchange="setV('','${k}',this.value)">${a.map(x=>`<option ${x===d[k]?'selected':''}>${x}</option>`).join('')}</select>`;
$('app').innerHTML=`<div class="card"><h3>بيانات الإيصال</h3><div class="g2">${I(d,'no','رقم الإيصال')}${I(d,'d','التاريخ')}${I(d,'amt','المبلغ المستلم (رقمًا)','type=number step=any')}</div><div id="aw" class="note">${tafqeet(d.amt)||'اكتب المبلغ ليظهر كتابةً'}</div></div>
<div class="card"><h3>بيانات العميل (المسلِّم)</h3><div class="g2">${I(p,'name','الاسم بالكامل')}${I(p,'nid','رقم البطاقة','inputmode=numeric maxlength=14')}${I(p,'phone','رقم التليفون','inputmode=tel')}<div><label>صفة المسلِّم</label><select onchange="setV('p1','cap',this.value);ed()"><option ${!rep?'selected':''}>المالك</option><option ${rep?'selected':''}>نائب / وكيل عن المالك</option></select></div>${rep?I(p,'owner','اسم المالك الأصلي')+I(p,'capNote','توضيح الصفة (وكالة / تفويض...)'):''}</div></div>
<div class="card"><h3>سبب السداد</h3><div class="g2"><div><label>نوع الاتفاق</label>${Sel('ctype',['إشراف','تشطيبات','توريدات','أخرى'])}</div><div><label>نوع الدفعة</label>${Sel('kind',KINDS)}</div>${I(d,'ref','رقم الاتفاق / العقد / المستخلص')}${I(d,'proj','المشروع / موقع العمل')}${I(d,'val','قيمة الاتفاق الإجمالية (اختياري)','type=number step=any')}${I(d,'before','المسدد سابقًا','type=number step=any')}<div><label>نوع المخالصة</label>${Sel('final',['جزئية','نهائية'])}</div></div><label>ملاحظات (اختياري)</label><textarea rows="2" onchange="setV('','notes',this.value)">${esc(d.notes)}</textarea></div>
<div class="card"><h3>بيانات الشركة (تُحفظ مرة واحدة)</h3><div class="g2">${I(CO,'addr','عنوان الشركة')}${I(CO,'phone','تليفون الشركة')}${I(CO,'reg','رقم السجل التجاري')}${I(CO,'tax','رقم البطاقة الضريبية')}${I(CO,'rname','اسم المستلم من الشركة')}${I(CO,'rtitle','صفته')}</div></div>
<div class="card"><button class="btn p" onclick="prev()">معاينة / طباعة / مشاركة</button> <button class="btn" onclick="saveH()">حفظ في السجل وإيصال جديد</button> <button class="btn d" onclick="fresh()">مسح</button></div>
<div class="card"><h3>سجل الإيصالات (${H.length})</h3>${H.map((x,i)=>`<div class="row"><span>${esc(x.no)} · ${esc(x.p1.name)}<div class="sub">${fmt(x.amt)} جنيه · ${esc(x.ctype)} · ${esc(x.d)}</div></span><span><button class="btn s" onclick="ov(recHtml(H[${i}]),H[${i}].no,recText(H[${i}]))">عرض</button> <button class="btn s" onclick="loadH(${i})">تعديل</button> <button class="btn s d" onclick="delH(${i})">✕</button></span></div>`).join('')||'<span class=sub>لا توجد إيصالات محفوظة</span>'}</div>`}
function setV(o,k,x){const t=o==='co'?CO:o?C[o]:C;t[k]=['amt','val','before'].includes(k)?(+x||0):x;o==='co'?sv(K2,CO):sv(K,C);if(k==='amt')$('aw').textContent=tafqeet(C.amt)||'اكتب المبلغ ليظهر كتابةً'}
function prev(){if(!C.amt)return alert('اكتب المبلغ أولًا');ov(recHtml(C),C.no,recText(C))}
function saveH(){if(!C.amt||!C.p1.name)return alert('اكتب اسم العميل والمبلغ');const i=H.findIndex(x=>x.no===C.no);if(i>=0)H[i]=C;else H.unshift(C);sv(K3,H);C=blank();sv(K,C);ed();scrollTo(0,0)}
function loadH(i){C=JSON.parse(JSON.stringify(H[i]));sv(K,C);ed();scrollTo(0,0)}
function delH(i){if(confirm('حذف الإيصال من السجل؟')){H.splice(i,1);sv(K3,H);ed()}}
function fresh(){if(confirm('مسح البيانات الحالية؟')){C=blank();sv(K,C);ed()}}
ed();
</script></body></html>
